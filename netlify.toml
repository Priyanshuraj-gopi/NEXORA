[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://image.pollinations.ai https://*.pollinations.ai https://api.qrserver.com https://*.openai.com https://*.blob.core.windows.net https://*.supabase.co https://images.unsplash.com; media-src 'self' blob: data:; connect-src 'self' https://image.pollinations.ai https://*.pollinations.ai https://generativelanguage.googleapis.com https://api.openai.com https://router.huggingface.co https://*.supabase.co; frame-ancestors 'none';"
